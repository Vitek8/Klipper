# You will need to configure a neopixel (or other addressable led, such as dotstar). See
# https://www.klipper3d.org/Config_Reference.html#neopixel for configuration details.
# And you can get sb led MACRO here: https://github.com/PrinterConfigs/DoomConfig/blob/master/stealthburner.cfg
# Or here https://github.com/sttts/voron-klipper-config/blob/master/stealthburner_leds.cfg
[neopixel sb_leds]
pin: sb_can_th:PB11
chain_count: 10
color_order: GRB,GRB,GRB,GRB,GRB,GRB,GRB,GRB,GRBW,GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0 
initial_WHITE: 0.0


# volani makra: LED_STATUS R=x G=y B=z
[gcode_macro LED_STATUS]
gcode:
    {% set led_brightness = printer["gcode_macro _User_Variables"].led_brightness %}
    {% if 'R' in params and 'G' in params and 'B' in params %}
      {% set R = led_brightness*params.R|float %}
      {% set G = led_brightness*params.G|float %}
      {% set B = led_brightness*params.B|float %}
      { action_respond_info("R=%f G=%f B=%f" % (R, G, B)) }    
      {% for i in range(1, 8) %}
          SET_LED LED=sb_leds RED={R} GREEN={G} BLUE={B} INDEX={i}
      {% endfor %}
      SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=9
      SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=10
    {% else %}
      {% for i in range(1, 8) %}
          SET_LED LED=sb_leds RED=0 GREEN=0.1 BLUE=0 INDEX={i}
      {% endfor %}
      SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=9
      SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=10
    {% endif %}

[gcode_macro LED_STATUS_QGL]
gcode:
    LED_STATUS R=0 G=0 B=1

[gcode_macro LED_STATUS_HEATING]
gcode:
    LED_STATUS R=1 G=0 B=0

[gcode_macro LED_STATUS_HOMING]
gcode:
    LED_STATUS R=1 G=0 B=1

[gcode_macro LED_STATUS_IDLE]
gcode:
    LED_STATUS R=1 G=1 B=1

