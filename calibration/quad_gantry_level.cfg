[quad_gantry_level]
##	Gantry Corners for TAP 350mm Build
gantry_corners:
	-60,-10
	410,420
##	Probe points
points_macro: _qgl_points_macro

horizontal_move_z: 10
speed: 1000
retries: 5
retry_tolerance: 0.015
max_adjust: 10
verbose: False


[gcode_macro _CUSTOM_QGL]
gcode:        
  {% set qgl = printer["gcode_macro _qgl_points_macro"] %}
  
  SET_GCODE_VARIABLE MACRO=_Sensorless_Homing_Variables VARIABLE=safe_x VALUE={qgl.x1}
  SET_GCODE_VARIABLE MACRO=_Sensorless_Homing_Variables VARIABLE=safe_y VALUE={qgl.y1}
  
  {% set TARGET_BED_TEMP = printer.heater_bed.target %}
  {% set BED_TEMP = 60 %}   
      
  {% if TARGET_BED_TEMP != 0 %}
    {% set BED_TEMP = TARGET_BED_TEMP %}   
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% else %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}
   
  _LAZY_HOME X={qgl.x1} Y={qgl.y1} Z={10}
  QUAD_GANTRY_LEVEL
  SET_GCODE_VARIABLE MACRO=_Sensorless_Homing_Variables VARIABLE=safe_x VALUE=-128
  SET_GCODE_VARIABLE MACRO=_Sensorless_Homing_Variables VARIABLE=safe_y VALUE=-128
       

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
  # If QGL is not applied, first run a course calibration
  {% if printer.quad_gantry_level.applied == False %}
      _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
  {% endif %}
  # then perform fine QGL down to desired spec
  # this has to be a separate macro call so the results of the above call will be visible!
  _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
  {% if printer.quad_gantry_level.applied == True %}
      # go for full quality at reduced probing height
      _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=5.0  # <- set your preferred probing height here!
  {% else %}
      # This should never happen, just perform the full calibration using the defaults
      {action_respond_info("Fine QGL called without calling course QGL first!")}
      _QUAD_GANTRY_LEVEL  # default behavior, no speedup
  {% endif %}