#####################################################################
# PURGE VARIABLES
#####################################################################

[gcode_macro _purge_variables]
description: This macro contains all adjustable settings for KAMP 

# The following variables are settings for KAMP as a whole.
variable_verbose_enable: False               # Set to True to enable KAMP information output when running. This is useful for debugging.

# The following variables are for adjusting adaptive mesh settings for KAMP.
variable_mesh_margin: 5                     # Expands the mesh size in millimeters if desired. Leave at 0 to disable.
variable_fuzz_amount: 0                     # Slightly randomizes mesh points to spread out wear from nozzle-based probes. Leave at 0 to disable.

# The following variables are for those with a dockable probe like Klicky, Euclid, etc.                 # ----------------  Attach Macro | Detach Macro
variable_probe_dock_enable: False           # Set to True to enable the usage of a dockable probe.      # ---------------------------------------------
# variable_attach_macro: 'Attach_Probe'       # The macro that is used to attach the probe.               # Klicky Probe:   'Attach_Probe' | 'Dock_Probe'
# variable_detach_macro: 'Dock_Probe'         # The macro that is used to store the probe.                # Euclid Probe:   'Deploy_Probe' | 'Stow_Probe'
                                                                                                        # Legacy Gcode:   'M401'         | 'M402'

# The following variables are for adjusting adaptive purge settings for KAMP.
variable_purge_height: 0.8                  # Z position of nozzle during purge, default is 0.8.
variable_tip_distance: 5                   # Distance between tip of filament and nozzle before purge. Should be similar to PRINT_END final retract amount.
variable_purge_margin: 30                   # Distance the purge will be in front of the print area, default is 10.
variable_purge_amount: 30                   # Amount of filament to be purged prior to printing.
variable_flow_rate: 10                     # Flow rate of purge in mm3/s. Default is 12.

variable_counter: 0     			# Počítadlo aktuuálně vytvořených purge
variable_purge_step: 5.0			# Posun mezi jednotlivými purge pozicemi
variable_purge_max_position: 340.0	# Konec oblasti
variable_purge_min_position: 20.0	# Začátek oblasti
variable_z_offset: 0 				# Aktuální výška, ve které se vytváří purge
variable_z_step: 0.8 				# Zvednutí purge po projetí celé Y oblasti

gcode:

#####################################################################
# CLEANING NOZZLE VARIABLES
#####################################################################

[gcode_macro _brush_variables]
variable_x: 200
variable_y: 10
variable_z: 2.15

variable_wipe_left_x: 163
variable_wipe_left_y: 7
variable_wipe_right_x: 180
variable_wipe_right_y: 10

variable_wipe_speed: 50000
variable_travel_speed: 30000
variable_retract_length: 1
variable_wipes: 5
variable_cycles: 2
gcode:


#####################################################################
# SENSORLESS_HOMING VARIABLES
#####################################################################

[gcode_macro _Sensorless_Homing_Variables]
description: Variables for sensorless homing X and Y

variable_homing_current: 0.0                # The desired motor current for homing the X and Y axes. Leave as '0.0' to use run_current values instead.
variable_clear_time: 1                      # Time in seconds to wait for stallguard registers to clear, default is 1 second.
variable_x_backoff_distance: 5              # Distance in mm to back off from the X axis after homing.
variable_y_backoff_distance: 5              # Distance in mm to back off from the Y axis after homing.
variable_z_hop_distance: 10                 # Distance to move Z axis prior to homing, and after homing.
variable_first_homed_axis: 'X'              # First axis to home when 'G28' is called. Some prefer homing Y before X.

## The following variables are used for moving the printhead to a certain part of the bed before homing the Z axis:

variable_safe_z_enable: True               # Enables/disables moving the printhead before homing the Z axis.
variable_safe_x: -128                       # Safe X position to home the Z axis, leave at -128 to home to the center of the X axis.
variable_safe_y: -128                       # Safe Y position to home the Z axis, leave at -128 to home to the center of the Y axis.

# Do not modify below
gcode: