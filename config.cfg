#####################################################################
# SENSORLESS_HOMING VARIABLES
#####################################################################

[gcode_macro _Sensorless_Homing_Variables]
description: Variables for sensorless homing X and Y

variable_homing_current: 0.0                # The desired motor current for homing the X and Y axes. Leave as '0.0' to use run_current values instead.
variable_clear_time: 1                      # Time in seconds to wait for stallguard registers to clear, default is 1 second.
variable_x_backoff_distance: 5              # Distance in mm to back off from the X axis after homing.
variable_y_backoff_distance: 5              # Distance in mm to back off from the Y axis after homing.
variable_z_hop_distance: 10                 # Distance to move Z axis prior to homing, and after homing.
variable_first_homed_axis: 'X'              # First axis to home when 'G28' is called. Some prefer homing Y before X.

## The following variables are used for moving the printhead to a certain part of the bed before homing the Z axis:

variable_safe_z_enable: True               # Enables/disables moving the printhead before homing the Z axis.
variable_safe_x: -128                       # Safe X position to home the Z axis, leave at -128 to home to the center of the X axis.
variable_safe_y: -128                       # Safe Y position to home the Z axis, leave at -128 to home to the center of the Y axis.

gcode:


[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos    : True 	# use custom park coordinates for x,y [True/False]
variable_custom_park_x     : 335.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y     : 335.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz    : 5.0   	; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract           : 2.0   	; the value to retract while PAUSE
#variable_cancel_retract   : 5.0   	; the value to retract while CANCEL_PRINT
#variable_speed_retract    : 35.0  	; retract speed in mm/s
#variable_unretract        : 1.0   	; the value to unretract while RESUME
#variable_speed_unretract  : 35.0  	; unretract speed in mm/s
#variable_speed_hop        : 15.0  	; z move speed in mm/s
#variable_speed_move       : 100.0 	; move speed in mm/s
variable_park_at_cancel    : True   	# allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
#variable_park_at_cancel_x : None  	; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
#variable_park_at_cancel_y : None  	; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
## !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
#variable_use_fw_retract   : False 	; use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout     : 0     	; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#variable_runout_sensor    : ""    	; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
##                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
## !!! Custom macros, please use with care and review the section of the corresponding macro.
## These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
## Only  single line commands are supported, please create a macro if you need more than one command.
variable_user_pause_macro : "_AFTER_PAUSE"	# Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: "_AFTER_RESUME"	# Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: "_AFTER_CANCEL" #Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function

variable_safe_x: 0.0
variable_safe_y: 0.0
variable_safe_z: 0.0

gcode:

[gcode_macro _AFTER_RESUME]
gcode:
	CLEAR_NOZZLE
    LINE_PURGE
    
    {% set client = printer["gcode_macro _CLIENT_VARIABLE"] %}

    {% set x = client.safe_x|float %}
    {% set y = client.safe_y|float %}
    {% set z = client.safe_z|float %}
    
    G90
    G1 Z{z + 5.0} F3000
    G1 X{x} Y{y} F6000

[gcode_macro _AFTER_PAUSE]
gcode:
	{% set x = printer.gcode_move.gcode_position.x %}
    {% set y = printer.gcode_move.gcode_position.y %}
    {% set z = printer.gcode_move.gcode_position.z %}

    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=safe_x VALUE={x}
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=safe_y VALUE={y}
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=safe_z VALUE={z}

[gcode_macro _AFTER_CANCEL]
gcode:
	SET_GCODE_VARIABLE MACRO=_printer_states VARIABLE=printing VALUE=0
