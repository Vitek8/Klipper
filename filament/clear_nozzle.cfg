[gcode_macro CLEAR_NOZZLE]
description: Clean nozzle on the brush
gcode:

	{% set brush = printer["gcode_macro _brush_variables"] %}
    
    ##### Nastavení #####    
    {% set safe_z = printer.gcode_move.gcode_position.z + 5.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
	{% set safe_z = [safe_z, max_z - 1.0] | min %}
        
    {% set travel_speed = 30000 %}
    
    
    {% set travel_speed = brush.travel_speed %}
    {% set retract_length = brush.retract_length %}
    {% set wipes = brush.wipes %}
    {% set cycles = brush.cycles %}

    ##### Ulož aktuální stav #####
    SAVE_GCODE_STATE NAME=CLEAR_NOZZLE_STATE

    G90                         ; Absolutní souřadnice
    M83                         ; Relativní extruder
	
    ##### Přesun nad kartáček #####
    {% if not params.SKIP_MOVE|default(0)|int %}
      G1 Z{safe_z} F3000
      G1 X{brush.x} Y{brush.y} F{travel_speed}
    {% endif %}
    G1 Z{brush.z} F3000


    ##### očištění #####
    {% for j in range(cycles) %}

        G1 X{brush.x} Y{brush.y} Z{brush.z} F{travel_speed}

        {% if printer.extruder.can_extrude %}
            G1 E-{retract_length} F500
        {% endif %}

        G4 P300

        _WIPE COUNT={wipes}

    {% endfor %}

    ##### Odjezd #####
    G1 Z{safe_z} F3000

    RESTORE_GCODE_STATE NAME=CLEAR_NOZZLE_STATE

    G1 E{cycles * retract_length} F500

[gcode_macro _WIPE]
gcode:
	{% set brush = printer["gcode_macro _brush_variables"] %}
    {% set wipe_left_x = brush.wipe_left_x %}
    {% set wipe_left_y = brush.wipe_left_y %}
    {% set wipe_right_x = brush.wipe_right_x %}
    {% set wipe_right_y = brush.wipe_right_y %}
    {% set wipe_speed = brush.wipe_speed %}
    
    {% set count = params.COUNT|default(10)|int %}

    {% for i in range(count) %}
        G1 X{wipe_left_x} Y{wipe_left_y} F{wipe_speed}
        G1 X{wipe_right_x} Y{wipe_right_y} F{wipe_speed}
    {% endfor %} 