[belay my_belay]
extruder_type: extruder_stepper
extruder_stepper_name: my_extruder_stepper
start_sensor: ^PA2
stop_sensor: ^PA3
multiplier_high: 1.2
multiplier_low: 0.5
debug_level: 0

[extruder_stepper my_extruder_stepper]
extruder: extruder

step_pin: PE1
dir_pin: !PE0
enable_pin: !PC5

microsteps: 16
rotation_distance: 9.18