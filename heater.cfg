#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
##	SSR Pin - In BED OUT position
heater_pin: PB4
sensor_type: NTC 100K MGB18-104F39050L32
#sensor_pin: PC3 # Spider 1.x
sensor_pin: PB0 # Spider 2.x
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.6
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

##  In E0-MOT Position
[extruder]
step_pin: sb_can_th:PB3
dir_pin: !sb_can_th:PA8
enable_pin: !sb_can_th:PA15

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point for Bondtech 5mm gears
##  34.37086 for Bondtech 8mm gears (Galileo)
rotation_distance: 22   #22.6789511   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
##  Use 7.5:1 for Galileo
gear_ratio: 50:10               #for Stealthburner/Clockwork2 BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: sb_can_th:PC15 # Heat
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
sensor_pin: sb_can_th:PA6 # TH
min_temp: 1
max_temp: 360
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.02 #0.05
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 50.0


[tmc2209 extruder]
uart_pin: sb_can_th:PA10
tx_pin: sb_can_th:PA9
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
##diag_pin: sb_can_th:PB5

#####################################################################
#	Mcu and Host Temperature
#####################################################################

[temperature_sensor main_mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90

[temperature_sensor can_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: sb_can_th
min_temp: 0
max_temp: 100

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE

gcode:
    _SET_HEATER_TEMPERATURE {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}
    {% if params.MINIMUM|default(-1)|float != -1 %}
      TEMPERATURE_WAIT SENSOR={params.HEATER} MINIMUM={params.MINIMUM|float}
    {% elif params.WAIT|default("False") == "True" %}
      TEMPERATURE_WAIT SENSOR={params.HEATER} MINIMUM={params.TARGET|float}
    {% endif %}

[gcode_macro M104]
rename_existing: M104.0

gcode:  
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={params.S}

[gcode_macro M109]
rename_existing: M109.0

gcode:        
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={params.S} WAIT=True


[gcode_macro M140]
rename_existing: M140.0

gcode:  
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.S}

[gcode_macro M190]
rename_existing: M190.0

gcode:   
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.S} WAIT=True


[gcode_macro TURN_OFF_HEATERS]
rename_existing: _TURN_OFF_HEATERS
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0  
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0


   

