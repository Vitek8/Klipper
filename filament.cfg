[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    SET_LED_EFFECT EFFECT=sb_critical_error
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state
    status_busy

[gcode_macro CLEAR_NOZZLE]
gcode:
    G90                        
    G1 Z10 F1000                 
    # G1 E-5 F300
    G1 X230 Y2 Z8.3 F6000      

    {% for i in range(5) %}
        G1 X195 F50000
        G1 X230 F50000
    {% endfor %}
    
    G1 Z7.5 F6000 
    {% for i in range(5) %}
        G1 X195 F50000
        G1 X230 F50000
    {% endfor %}
    G1 X230 F50000             
    G1 Z10 F1000
    G4 P6000
    _LAZY_HOME

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  80
variable_purge_distance:  25
gcode:
    RESPOND MSG="teplota load: { printer['gcode_macro _filament_temperature'].liquid_temperature } C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={printer['gcode_macro _filament_temperature'].liquid_temperature} WAIT=True
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 30 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state
    G4 P5000
    {% if printer.toolhead.homed_axes == "xyz" %}
      CLEAR_NOZZLE
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  71
variable_purge_distance:  10
gcode:
    _CANCEL
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 30 %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={printer['gcode_macro _filament_temperature'].liquid_temperature} WAIT=True
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state
  
[gcode_macro _SELECT]
gcode:
    _CANCEL
    {% if params.FILAMENT_TYPE == '0' %} 
        RESPOND MSG="Vybrana teplota: { printer['gcode_macro _filament_temperature'].filament_temperature } C, teplota tani: { printer['gcode_macro _filament_temperature'].liquid_temperature } C"
    {% elif params.FILAMENT_TYPE == '1' %}
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=filament_temperature VALUE={ printer["gcode_macro _filament_temperature"].temperature_pla | int }
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=liquid_temperature VALUE={ printer["gcode_macro _filament_temperature"].liquid_temperature_pla | int }
        RESPOND MSG="Vybran PLA, teplota: { printer['gcode_macro _filament_temperature'].temperature_pla } C, teplota tani: { printer['gcode_macro _filament_temperature'].liquid_temperature_pla } C"
    {% elif params.FILAMENT_TYPE == '2' %}
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=filament_temperature VALUE={ printer["gcode_macro _filament_temperature"].temperature_petg | int }
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=liquid_temperature VALUE={ printer["gcode_macro _filament_temperature"].liquid_temperature_petg | int }
        RESPOND MSG="Vybran PETG, teplota: { printer['gcode_macro _filament_temperature'].temperature_petg } C, teplota tani: { printer['gcode_macro _filament_temperature'].liquid_temperature_petg } C"
    {% elif params.FILAMENT_TYPE == '3' %}
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=filament_temperature VALUE={ printer["gcode_macro _filament_temperature"].temperature_abs | int }
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=liquid_temperature VALUE={ printer["gcode_macro _filament_temperature"].liquid_temperature_abs | int }
        RESPOND MSG="Vybran ABS, teplota: { printer['gcode_macro _filament_temperature'].temperature_abs } C, teplota tani: { printer['gcode_macro _filament_temperature'].liquid_temperature_abs } C"
    {% elif params.FILAMENT_TYPE == '4' %}
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=filament_temperature VALUE={ printer["gcode_macro _filament_temperature"].temperature_tpu | int }
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=liquid_temperature VALUE={ printer["gcode_macro _filament_temperature"].liquid_temperature_tpu | int }
        RESPOND MSG="Vybran TPU, teplota: { printer['gcode_macro _filament_temperature'].temperature_tpu } C, teplota tani: { printer['gcode_macro _filament_temperature'].liquid_temperature_tpu } C"
    {% elif params.FILAMENT_TYPE == '5' %}
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=filament_temperature VALUE={ printer["gcode_macro _filament_temperature"].temperature_nylon | int }
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=liquid_temperature VALUE={ printer["gcode_macro _filament_temperature"].liquid_temperature_nylon | int }
        RESPOND MSG="Vybran Nylon, teplota: { printer['gcode_macro _filament_temperature'].temperature_nylon } C, teplota tani: { printer['gcode_macro _filament_temperature'].liquid_temperature_nylon } C"
    {% elif params.FILAMENT_TYPE == '6' %}
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=filament_temperature VALUE={ printer["gcode_macro _filament_temperature"].temperature_asa | int }
        SET_GCODE_VARIABLE MACRO=_filament_temperature VARIABLE=liquid_temperature VALUE={ printer["gcode_macro _filament_temperature"].liquid_temperature_asa | int }
        RESPOND MSG="Vybran ASA, teplota: { printer['gcode_macro _filament_temperature'].temperature_asa } C, teplota tani: { printer['gcode_macro _filament_temperature'].liquid_temperature_asa } C"
    {% else %}
        RESPOND MSG="Neznamy filament - zadej hodnotu 1-6."
    {% endif %}
    {% if params.HEATER|default('False') == 'True' %}
      RESPOND MSG="teplota select: { printer['gcode_macro _filament_temperature'].liquid_temperature } C"
      LOAD_FILAMENT
    {% endif %}





    
