#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

# [safe_z_home]
# home_xy_position:175,175
# speed:200  #100
# z_hop:10

[homing_override]
set_position_z: 0
gcode:
  {% set offset = 1 %}  
  SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=is_calibrating VALUE=1
  G90
  # home X
  {% if not 'Z' in params and not 'Y' in params and 'X' in params %}
    G1 Z10 F1000
    SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=z_offset VALUE=1
    status_calibrating_x
    G28 X
    G1 X{350-offset} F1000
  
  # home Y
  {% elif not 'Z' in params and not 'X' in params and 'Y' in params %}
    G1 Z10 F1000
    SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=z_offset VALUE=1
    status_calibrating_y
    G28 Y
    G1 Y{350-offset} F1000

  # home XY
  {% elif not 'Z' in params and 'X' in params and 'Y' in params %}
    G1 Z10 F1000
    SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=z_offset VALUE=1
    status_calibrating_y
    G28 Y
    G1 Y{350-offset} F1000
    status_calibrating_x
    G28 X
    G1 X{350-offset} F1000
    
  # home Z
  {% elif 'Z' in params and not 'X' in params and not 'Y' in params %}
    {% if printer.toolhead.homed_axes != "xyz" %}
      { action_raise_error('Must home axis first!') }
    {% else %}
      status_calibrating_z
      G1 Z10 F1000
      SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=z_offset VALUE=1
      G1 X175 Y175 F10000
      G28 Z
      G1 Z10
    {% endif %}
    
  # home XYZ
  {% else %}
    G1 Z10 F1000
    SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=z_offset VALUE=1
    status_calibrating_y
    G28 Y
    G1 Y{350-offset} F1000
    status_calibrating_x
    G28 X
    G1 X{350-offset} F1000
    G1 X175 Y175 F10000
    status_calibrating_z
    G28 Z
    G1 Z10
  {% endif %}
  {% if printer["gcode_macro _user_variables"].z_offset == 1 %}
    G1 Z0 F1000
    SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=z_offset VALUE=0
  {% endif %}
  RESPOND PREFIX="Z OFFSET = " MSG="{printer["gcode_macro _user_variables"].z_offset}"
  SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=is_calibrating VALUE=0

axes: xyz 

[gcode_macro LAZY_HOME]
gcode:
  SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=is_homing VALUE=1
  {% if printer.toolhead.homed_axes != "xyz" %}
    status_homing
    G28
  {% elif printer.toolhead.position.x != 175 or printer.toolhead.position.y != 175 or printer.toolhead.position.z != 10 %}
      status_homing
      G90
      G0  X175 Y175 Z10 F10000  
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=is_homing VALUE=0