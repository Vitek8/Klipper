# volani makra: _SET_LEDS R=x G=y B=z
[gcode_macro _SET_LEDS]
description: Nastavuje zjednodušený efekt pro všechny LED na hlavě tiskárny (volání _SET_LEDS R=x G=y B=z ... kde x,y,z je v itervalu <0,1>)
gcode:
    {% set led_brightness = printer["gcode_macro _user_variables"].led_brightness %}
    
    {% if 'R' in params and 'G' in params and 'B' in params %}
    
      {% set R = led_brightness*params.R|float %}
      {% set G = led_brightness*params.G|float %}
      {% set B = led_brightness*params.B|float %}  
      
      {% for i in range(1, 8) %}
          SET_LED LED=sb_leds RED={R} GREEN={G} BLUE={B} INDEX={i}
      {% endfor %}
      
      SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=9
      SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=1 INDEX=10
    
    {% else %}
    	status_error 
    {% endif %}

[gcode_macro _set_logo_leds_off]
gcode:
    _SET_LEDS R=0 G=0 B=0

[gcode_macro _set_logo_leds_on]
gcode:
    _SET_LEDS R=1 G=1 B=1

[gcode_macro _set_nozzle_leds_on]
gcode:
    _SET_LEDS R=1 G=1 B=1

[gcode_macro _set_nozzle_leds_off]
gcode:
    _SET_LEDS R=0 G=0 B=0

[gcode_macro _status_off]
gcode:
    _SET_LEDS R=0 G=0 B=0

[gcode_macro _status_ready]
gcode:
    _SET_LEDS R=1 G=1 B=1

[gcode_macro _status_part_ready]
gcode:
    _SET_LEDS R=0 G=1 B=0

[gcode_macro _status_busy]
gcode:
    _SET_LEDS R=1 G=1 B=0

[gcode_macro _status_heating]
gcode:
    _SET_LEDS R=1 G=0 B=0

[gcode_macro _status_cooling]
gcode:
    _SET_LEDS R=0 G=0 B=1

[gcode_macro _status_leveling]
gcode:
    _SET_LEDS R=0 G=1 B=1

[gcode_macro _status_homing]
gcode:
    _SET_LEDS R=1 G=0 B=1

[gcode_macro _status_cleaning]
gcode:
    _SET_LEDS R=1 G=0.5 B=0

[gcode_macro _status_meshing]
gcode:
    _SET_LEDS R=0 G=1 B=1

[gcode_macro _status_calibrating_x]
gcode:
    _SET_LEDS R=1 G=0.5 B=0

[gcode_macro _status_calibrating_y]
gcode:
    _SET_LEDS R=1 G=0 B=0.5

[gcode_macro _status_calibrating_z]
gcode:
    _SET_LEDS R=0.5 G=1 B=0

[gcode_macro _status_printing]
gcode:
    _SET_LEDS R=0 G=1 B=0

[gcode_macro _status_error]
gcode:
    _SET_LEDS R=1 G=0 B=0