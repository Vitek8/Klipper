#[display]
#	mini12864 LCD Display
#lcd_type: uc1701
#cs_pin: PC11
#a0_pin: PD2
#rst_pin: PC10
#encoder_pins: ^PC6,^PC7
#click_pin: ^!PA8
#contrast: 63
##spi_bus: spi1
#spi_software_mosi_pin: PA7
#spi_software_miso_pin: PA6
#spi_software_sclk_pin: PA5

[gcode_macro CHANGE_FILAMENT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Nevermind just close this >>>"
    RESPOND TYPE=command MSG="action:prompt_text Do you want to load a new filament?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Load|SELECT_FILAMENT HEATER=True"
    RESPOND TYPE=command MSG="action:prompt_footer_button Unload|UNLOAD_FILAMENT|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CANCEL]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro SELECT_FILAMENT]
gcode:
    {% if params.HEATER|default('False') == 'True' %} 
      RESPOND MSG="Po zvoleni vyhrivam!"
      RESPOND TYPE=command MSG="action:prompt_begin Select Filament"
      RESPOND TYPE=command MSG="action:prompt_text Choose filament to load"
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      RESPOND TYPE=command MSG="action:prompt_button ?|_SELECT FILAMENT_TYPE=0 HEATER=True|info"
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      RESPOND TYPE=command MSG="action:prompt_button PLA|_SELECT FILAMENT_TYPE=1 HEATER=True|primary"
      RESPOND TYPE=command MSG="action:prompt_button PETG|_SELECT FILAMENT_TYPE=2 HEATER=True|primary"
      RESPOND TYPE=command MSG="action:prompt_button ABS|_SELECT FILAMENT_TYPE=3 HEATER=True|primary"
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      RESPOND TYPE=command MSG="action:prompt_button TPU|_SELECT FILAMENT_TYPE=4 HEATER=True|info"
      RESPOND TYPE=command MSG="action:prompt_button Nylon|_SELECT FILAMENT_TYPE=5 HEATER=True|info"
      RESPOND TYPE=command MSG="action:prompt_button ASA|_SELECT FILAMENT_TYPE=6 HEATER=True|info"
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_button Cancel|_CANCEL|error"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_begin Select Filament"
      RESPOND TYPE=command MSG="action:prompt_text Choose filament to load"
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      RESPOND TYPE=command MSG="action:prompt_button ?|_SELECT FILAMENT_TYPE=0|info"
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      RESPOND TYPE=command MSG="action:prompt_button PLA|_SELECT FILAMENT_TYPE=1|primary"
      RESPOND TYPE=command MSG="action:prompt_button PETG|_SELECT FILAMENT_TYPE=2|primary"
      RESPOND TYPE=command MSG="action:prompt_button ABS|_SELECT FILAMENT_TYPE=3|primary"
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      RESPOND TYPE=command MSG="action:prompt_button TPU|_SELECT FILAMENT_TYPE=4|info"
      RESPOND TYPE=command MSG="action:prompt_button Nylon|_SELECT FILAMENT_TYPE=5|info"
      RESPOND TYPE=command MSG="action:prompt_button ASA|_SELECT FILAMENT_TYPE=6|info"
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_button Cancel|_CANCEL|error"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Po zvoleni nevyhrivam!"
    {% endif %}







