[gcode_macro _LAZY_HOME]
gcode:
  {% set home = printer["gcode_macro _home_variables"] %}
  
  {% set has_position = params.X is defined
                        and params.Y is defined
                        and params.Z is defined %}

  # standard homing
  {% if printer.toolhead.homed_axes != "xyz" %}
  
    status_homing
  	G28
    
  # custom position      
  {% elif has_position %}
  
  	{% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set z = [params.Z|float, home.z]|max %}
           
    {% if printer.toolhead.position.x != x
          or printer.toolhead.position.y != y
          or printer.toolhead.position.z != z %}

      status_homing
      G90
      G0  X{x} Y{y} Z{z} F10000
        
    {% endif %}
    
  # default position      
  {% elif printer.toolhead.position.x != home.x
          or printer.toolhead.position.y != home.y
          or printer.toolhead.position.z != home.z %}
  
      	status_homing
      	G90
      	G0 X{home.x} Y{home.y} Z{home.z} F10000
        
  {% endif %}