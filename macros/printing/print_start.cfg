[gcode_macro PRINT_START]
gcode: 
    {% set BED_TEMP = params.BED|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}
    
    M220 S100    ; Speed Factor = 100 %
    M221 S100    ; Flow Factor = 100 %
    SET_GCODE_VARIABLE MACRO=_purge_settings VARIABLE=counter VALUE=0
    SET_GCODE_VARIABLE MACRO=_purge_settings VARIABLE=z_offset VALUE=0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP} MINIMUM={BED_TEMP-10}
    
    _LAZY_HOME
    _CUSTOM_QGL
    
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1

    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP} WAIT=True
    CLEAR_NOZZLE
    LINE_PURGE