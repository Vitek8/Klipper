[gcode_macro PRINT_START]
gcode: 
    {% set BED_TEMP = params.BED|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}
    {% set qgl = printer["gcode_macro _qgl_points_macro"] %}
    {% set brush = printer["gcode_macro _brush_variables"] %}
    
    M220 S100    ; Speed Factor = 100 %
    M221 S100    ; Flow Factor = 100 %

	SET_GCODE_VARIABLE MACRO=_printer_states VARIABLE=printing VALUE=0
    
    SET_GCODE_VARIABLE MACRO=_purge_variables VARIABLE=counter VALUE=0
    SET_GCODE_VARIABLE MACRO=_purge_variables VARIABLE=z_offset VALUE=0
    
    SET_GCODE_VARIABLE MACRO=_Sensorless_Homing_Variables VARIABLE=safe_x VALUE={qgl.x1}		; nastaveni polohy x pro homing
    SET_GCODE_VARIABLE MACRO=_Sensorless_Homing_Variables VARIABLE=safe_y VALUE={qgl.y1}		; nastaveni polohy y pro homing
    
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP} MINIMUM={BED_TEMP-20}

    _LAZY_HOME X={qgl.x1} Y={qgl.y1} Z=10
    _CUSTOM_QGL
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1
    _LAZY_HOME X={brush.x} Y={brush.y} Z={brush.z + 5}
    
	SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP} WAIT=True
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP} WAIT=True
    CLEAR_NOZZLE SKIP_MOVE=1	# neni potreba se presouvat na parkovaci misto pro cisteni trysky, protoze tryska uz na pozici je
    LINE_PURGE
    
    SET_GCODE_VARIABLE MACRO=_printer_states VARIABLE=printing VALUE=1