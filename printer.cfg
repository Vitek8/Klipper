#####################################################################
# VORON 2.4
# Main configuration
#####################################################################


#####################################################################
# HARDWARE
#####################################################################

[include hardware/mcu.cfg]
[include hardware/stepper.cfg]
[include hardware/bed_heater.cfg]
[include hardware/extruder.cfg]
[include hardware/fan.cfg]
[include hardware/led.cfg]


#####################################################################
# PROBES
#####################################################################

# [include probes/voron_tap.cfg]
[include probes/eddy.cfg]


#####################################################################
# SENSORS
#####################################################################

[include sensors/accelerometer.cfg]
[include sensors/temperature.cfg]


#####################################################################
# CALIBRATION
#####################################################################

[include calibration/input_shaper.cfg]
[include calibration/axis_twist_compensation.cfg]
[include calibration/qgl.cfg]
[include calibration/bed_mesh.cfg]
[include calibration/eddy_calibration.cfg]


#####################################################################
# MACROS
#####################################################################

[include macros/set_heater_temperature.cfg]
[include macros/printing/pause_resume.cfg]
[include macros/printing/print_start.cfg]
[include macros/printing/print_end.cfg]

[include macros/homing.cfg]
[include macros/timelapse.cfg]
[include macros/mainsail.cfg]



#####################################################################
# FILAMENT
#####################################################################

[include filament/filament.cfg]
[include filament/filament_buffer.cfg]
[include filament/clear_nozzle.cfg]
[include filament/firmware_retraction.cfg]


#####################################################################
# PURGE
#####################################################################

[include purge/purge_settings.cfg]
[include purge/line_purge.cfg]
[include purge/voron_purge.cfg]


#####################################################################
# CUSTOM
#####################################################################

# [include custom/hbb.cfg]
[include custom/led_effects.cfg]
# [include custom/test.cfg]
[include custom/variables.cfg]


#####################################################################
# OTHER
#####################################################################

#

#####################################################################
# PRINTER
#####################################################################


[printer]
kinematics: corexy
max_velocity: 500  
max_accel: 9000			        #Max 4000
max_z_velocity: 15			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
# SYSTEM
#####################################################################


[exclude_object]

[respond]

[force_move] 
enable_force_move: true 

