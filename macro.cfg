#####################################################################
#	Macros
#####################################################################    
[gcode_macro G32]
# rename_existing: QUAD_GANTRY_LEVEL
gcode:
      {% if printer.quad_gantry_level.applied == False %}
        BED_MESH_CLEAR
    
        LAZY_HOME
        
        {% set TARGET_EXTRUDER_TEMP = printer.extruder.target %}
        {% set TARGET_BED_TEMP = printer.heater_bed.target %}
        {% set EXTRUDER_TEMP = 150 %}
        {% set BED_TEMP = 60 %}   
            
        {% if TARGET_BED_TEMP != 0 %}
          {% set BED_TEMP = TARGET_BED_TEMP %}   
        {% endif %}
    
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP} MINIMUM={BED_TEMP-2}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP} WAIT=True
        
      
        SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=is_qgl VALUE=1
        QUAD_GANTRY_LEVEL
        SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=is_qgl VALUE=0
        
        LAZY_HOME
        {% endif %}
    

[gcode_macro PRINT_START]
gcode: 
    # Parameters
    {% set BED_TEMP = params.BED|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}
    
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    G32                        
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP} WAIT=True
    SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=is_printing VALUE=1
    VORON_PURGE
    BED_MESH_CALIBRATE
    LINE_PURGE
    

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-15.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z3.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z15 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X300 Y300 F3600            ; park nozzle at rear
    BED_MESH_CLEAR

[gcode_macro UPDATE_PRINTER_STATUS]
description: "Periodicky kontroluje stav tiskárny (tisk, ohřev, ochlazování extruderu a heated bedu)."
gcode:
    {% set is_printing = printer["gcode"].is_printing %}
    {% set is_calibrating = printer["gcode_macro _user_variables"].is_calibrating|int %}
    {% set is_qgl = printer["gcode_macro _user_variables"].is_qgl|int %}
    {% set is_homing = printer["gcode_macro _user_variables"].is_homing|int %}
    
    # Kontrola extruderu
    {% set extruder_target_temp = printer["extruder"].target|int %}
    {% set extruder_actual_temp = printer["extruder"].temperature|int %}
    
    # Kontrola heated bed
    {% set bed_target_temp = printer["heater_bed"].target|int %}
    {% set bed_actual_temp = printer["heater_bed"].temperature|int %}
    
    # Určení stavu pro extruder
    {% if extruder_target_temp > 0 and extruder_actual_temp < extruder_target_temp - 1 %}
        {% set extruder_status = 3 %}  # HEATING
    {% elif extruder_target_temp == 0 and extruder_actual_temp > 50 %}
        {% set extruder_status = 4 %}  # COOLING
    {% elif is_printing %}
        {% set extruder_status = 2 %}  # PRINTING
    {% else %}
        {% set extruder_status = 0 %}  # IDLE
    {% endif %}
    
    # Určení stavu pro heated bed
    {% if bed_target_temp > 0 and bed_actual_temp < bed_target_temp - 1 %}
        {% set bed_status = 3 %}  # HEATING
    {% elif bed_target_temp == 0 and bed_actual_temp > 50 %}
        {% set bed_status = 4 %}  # COOLING
    {% elif is_printing %}
        {% set bed_status = 2 %}  # PRINTING
    {% else %}
        {% set bed_status = 0 %}  # IDLE
    {% endif %}
    
    {% set current_bed_status = printer["gcode_macro _user_variables"].bed_status|int %}
    {% if bed_status != current_bed_status %}
        SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=bed_status VALUE={bed_status}
        {% if bed_status == 3 %}
          STOP_LED_EFFECTS LEDS="neopixel:sb_leds (9-10)"
          SET_LED_EFFECT EFFECT=heater_bed_temperature TARGET={bed_target_temp}
        {% elif bed_status == 4 %}
          STOP_LED_EFFECTS LEDS="neopixel:sb_leds (9-10)"
          SET_LED_EFFECT EFFECT=heater_bed_temperature TARGET={bed_actual_temp}
        {% endif %}    
    {% endif %}

    {% set current_extruder_status = printer["gcode_macro _user_variables"].extruder_status|int %}
    {% if extruder_status != current_extruder_status %}
        SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=extruder_status VALUE={extruder_status}
        {% if extruder_status == 3 %}
          STOP_LED_EFFECTS LEDS="neopixel:sb_leds (1-8)"
          SET_LED_EFFECT EFFECT=extruder_comet_temperature TARGET={extruder_target_temp}
        {% elif extruder_status == 4 %}
          STOP_LED_EFFECTS LEDS="neopixel:sb_leds (1-8)"
          SET_LED_EFFECT EFFECT=extruder_comet_temperature TARGET={extruder_actual_temp}
        {% endif %}    
    {% endif %}
    
    
    # Určení celkového stavu
    {% if extruder_status == 3 or bed_status == 3 %}
        {% set new_status = 3 %}  # HEATING
    {% elif extruder_status == 4 or bed_status == 4 %}
        {% set new_status = 4 %}  # COOLING
    {% elif extruder_actual_temp > 180 and bed_actual_temp > 60 %}
        {% set new_status = 1 %}  # READY
        status_ready
    {% elif is_printing %}
        {% set new_status = 2 %}  # PRINTING
        status_printing
    {% elif is_calibrating == 1 %}
        {% set new_status = 5 %}  # KALIBRATING
    {% elif is_qgl == 1 %}
        {% set new_status = 6 %}  # QGL
        status_leveling
    {% elif is_homing == 1 %}
        {% set new_status = 7 %}  # HOMING
    {% else %}
        {% set new_status = 0 %}  # IDLE
        status_ready
    {% endif %}
    
    # Zkontroluj, jestli se stav změnil
    {% set current_status = printer["gcode_macro _user_variables"].printer_status|int %}
    {% if new_status != current_status %}
        SET_GCODE_VARIABLE MACRO=_user_variables VARIABLE=printer_status VALUE={new_status}
        GET_PRINTER_STATUS
    {% endif %}
    UPDATE_DELAYED_GCODE ID=check_print_status DURATION=2


[delayed_gcode check_print_status]
gcode:
    UPDATE_PRINTER_STATUS

[gcode_macro START_STATUS_CHECK]
description: "Spustí periodickou kontrolu stavu tiskárny."
gcode:
    UPDATE_DELAYED_GCODE ID=check_print_status DURATION=2
    RESPOND PREFIX="PRINTER STATUS" MSG="Periodic status check started."

[gcode_macro STOP_STATUS_CHECK]
description: "Spustí periodickou kontrolu stavu tiskárny."
gcode:
    UPDATE_DELAYED_GCODE ID=check_print_status DURATION=0
    RESPOND PREFIX="PRINTER STATUS" MSG="Periodic status check stopped."

[gcode_macro GET_PRINTER_STATUS]
description: "Vrátí aktuální stav tiskárny."
gcode:
    {% set status_map = {0: "IDLE", 1: "READY", 2: "PRINTING", 3: "HEATING", 4: "COOLING", 5: "KALIBRATING", 6: "QGL", 7: "HOMING"} %}
    {% set printer_status = printer["gcode_macro _user_variables"].printer_status|int %}
    {% set status_text = status_map.get(printer_status, "UNKNOWN") %}
    RESPOND PREFIX="PRINTER STATUS" MSG="Current status: {status_text}"



