# [heater_fan controller_fan]
# ##	Controller fan - FAN2 Connector
# ## bocni ventilatory
# pin: PB2
# max_power: 1
# max_delta: 3.0 # fan turns on/off at 3° over/under target_temp
# kick_start_time: 0.5
# heater: heater_bed
# ##sensor_type: temperature_host
# target_temp: 51
# fan_speed: 0.4

[temperature_fan system_fan]
pin: PB2
max_power: 1
# control: pid # the type of hysteresis we are using
control: watermark # watermark pouzit pro hysterezi
max_delta: 3.0 # fan turns on/off at 3° over/under target_temp
sensor_type: temperature_host
max_temp: 90 # just the valid temperature ranges
min_temp: 10
max_speed: 0.4
min_speed: 0
# pid_Kp: 200
# pid_Ki: 0.05
# pid_Kd: 90
# pid_deriv_time: 2.0
target_temp: 50 # the initial target temperature for the fan



